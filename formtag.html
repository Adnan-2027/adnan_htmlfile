<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="email">Username</label>
        <input type="text" id="email" placeholder="email" required="true"><br><br>
        <label for="user_password">Password</label> 
        <input type="password" id="user_password" placeholder="password" required="true">
        <br><br>
        <lable for="DOB">Date</lable>
        <input type="date" id="DOB" > <br><br>
        <label for="file">Choose file</label>
        <input type="file" id="file"><br> <br>
        <lable for="color"> Choose color</lable>
        <input type="color" id="color"><br><br>
        <label for="range type">price range</label>
        <input type="range" id="range type"><br><br>
        <label for="male">Male:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="Female">Female:</label>
        <input type="radio" id="Female" name="gender" value="Female">
        <label for="other">other:</label>
        <input type="radio" id="other" name="gender" value="other"><br>
        <!--checbox using here-->
        <label for="CSE">computer Science:</label>
        <input type="checkbox" id="CSE" name="course_name" value="CSE">
        <label for="CIVIL">CIVIL</label>
        <input type="checkbox" id="CIVIL" name="course_name" value="CIVIL">
        <label for="ECE">ECE:</label>
        <input type="checkbox" id="ECE" name="course_name" value="ECE">
        <label for="MECH">MECH:</label>
        <input type="checkbox" id="MECH" name="course_name" value="MECH"><br><br>
         <label for="state">select your state</label>
        <select name="india" id="india">
            <option value="west bengal"> west bengal</option>
            <option value="bihar">bihar</option>
            <option value="up">up</option>
            <option value="JK">JK</option>
            <option value="JH">JH</option>
            <option value="Delhi">Delhi</option>
            <option value="Punjab">punkab</option>     
         </select><br><br>
         <textarea rows="4" cols="20">
            write tell me about your self in 100 words
         </textarea><br><br>
        <input type="submit" value="submit"><br><br>
    </form>
    <iframe width="400px" height="400" src="https://www.accuweather.com/en/in/kolkata/206690/weather-forecast/206690">WC3 SCHOOL</iframe>
</body>
